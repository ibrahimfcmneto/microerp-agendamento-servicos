{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto;">
    <div class="card" style="background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333;">
        <h2 style="color: var(--gold); margin-bottom: 25px; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px;">Novo Serviço</h2>
        
        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label style="color: #ccc; font-size: 14px; margin-bottom: 5px; display: block;">Nome do Serviço</label>
                <input type="text" name="name" placeholder="Ex: Barba Premium" required 
                       style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="color: #ccc; font-size: 14px; margin-bottom: 5px; display: block;">Duração (minutos)</label>
                <input type="number" name="duration" placeholder="Ex: 30" required 
                       style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="color: #ccc; font-size: 14px; margin-bottom: 5px; display: block;">Preço (R$)</label>
                <input type="number" step="0.01" name="price" placeholder="Ex: 45.00" required 
                       style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box;">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary" style="flex: 1; padding: 12px; font-weight: bold; cursor: pointer;">SALVAR SERVIÇO</button>
                <a href="{{ url_for('list_services') }}" class="btn btn-secondary" style="flex: 1; text-align: center; padding: 12px; text-decoration: none; border: 1px solid #555; color: #888;">CANCELAR</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
