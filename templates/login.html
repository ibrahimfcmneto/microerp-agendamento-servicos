{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card" style="background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center;">
        <h2 style="color: white; margin-bottom: 10px; font-family: 'Oswald', sans-serif; text-transform: uppercase;">Acesso Elite</h2>
        <p style="color: #888; margin-bottom: 30px; font-size: 14px;">Entre com suas credenciais para gerenciar sua agenda.</p>

        <form method="POST">
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="color: #ccc; font-size: 13px; margin-bottom: 5px; display: block;">Email</label>
                <input type="email" name="email" placeholder="seu@email.com" required 
                       style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box;">
            </div>

            <div style="text-align: left; margin-bottom: 30px;">
                <label style="color: #ccc; font-size: 13px; margin-bottom: 5px; display: block;">Senha</label>
                <input type="password" name="password" placeholder="••••••••" required 
                       style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box;">
            </div>

            <button type="submit" class="btn btn-primary" 
                    style="width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 6px; color: black; font-weight: bold; cursor: pointer; text-transform: uppercase;">
                Entrar
            </button>
        </form>
        
        <div style="margin-top: 25px; font-size: 14px;">
            <a href="{{ url_for('register') }}" style="color: var(--gold); text-decoration: none;">
                Não tem uma conta? <b>Cadastre-se</b>
            </a>
        </div>
    </div>
</div>
{% endblock %}
