{% extends "base.html" %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <div>
            <h4 style="color: var(--gold); margin-bottom: 5px; font-family: 'Oswald', sans-serif; letter-spacing: 2px;">GESTÃO DE AGENDA</h4>
            <h2 style="color: white; margin: 0; font-family: 'Oswald', sans-serif;">HORÁRIOS DE TRABALHO</h2>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">VOLTAR</a>
    </div>

    <div class="card" style="background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333;">
        <p style="color: #888; margin-bottom: 25px; font-size: 14px;">
            Configure seus turnos. Marque como <strong>Fechado</strong> os dias em que não haverá atendimento.
        </p>

        <form method="POST">
            <table style="width: 100%; border-collapse: collapse; color: #ccc;">
                <thead>
                    <tr style="border-bottom: 2px solid #333;">
                        <th style="padding: 15px; text-align: left; color: var(--gold);">DIA</th>
                        <th style="padding: 15px; text-align: center; color: var(--gold);">STATUS</th>
                        <th style="padding: 15px; text-align: center; color: var(--gold);">TURNO 1 (MANHÃ)</th>
                        <th style="padding: 15px; text-align: center; color: var(--gold);">TURNO 2 (TARDE)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for day in days_data %}
                    <tr id="row_{{ day.id }}" style="border-bottom: 1px solid #333; {% if day.is_closed %}opacity: 0.5;{% endif %}">
                        <td style="padding: 15px; color: white; font-weight: bold;">{{ day.name }}</td>
                        
                        <td style="padding: 15px; text-align: center;">
                            <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <input type="checkbox" name="closed_{{ day.id }}" onchange="toggleDay({{ day.id }}, this)"
                                       {% if day.is_closed %}checked{% endif %}>
                                Fechado
                            </label>
                        </td>

                        <td style="padding: 10px; text-align: center;">
                            <input type="time" name="start1_{{ day.id }}" value="{{ day.s1 }}" style="background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px;">
                            até
                            <input type="time" name="end1_{{ day.id }}" value="{{ day.e1 }}" style="background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px;">
                        </td>

                        <td style="padding: 10px; text-align: center;">
                            <input type="time" name="start2_{{ day.id }}" value="{{ day.s2 }}" style="background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px;">
                            até
                            <input type="time" name="end2_{{ day.id }}" value="{{ day.e2 }}" style="background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px;">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <div style="margin-top: 30px; text-align: right;">
                <button type="submit" class="btn btn-primary" style="padding: 15px 40px; font-weight: bold; cursor: pointer;">💾 SALVAR ALTERAÇÕES</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleDay(id, checkbox) {
        const row = document.getElementById('row_' + id);
        const inputs = row.querySelectorAll('input[type="time"]');
        
        if (checkbox.checked) {
            row.style.opacity = '0.5';
            inputs.forEach(input => input.disabled = true);
        } else {
            row.style.opacity = '1';
            inputs.forEach(input => input.disabled = false);
        }
    }
</script>
{% endblock %}
